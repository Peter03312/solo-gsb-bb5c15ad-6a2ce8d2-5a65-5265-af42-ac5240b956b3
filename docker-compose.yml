services:
  night-noise-api:
    build: .
    image: night-noise-api:latest
    container_name: night-noise-api
    ports:
      # 宿主机端口可通过环境变量 HOST_PORT 修改，默认 8000
      - "${HOST_PORT:-8000}:8000"
    environment:
      # 容器内服务监听端口（一般无需修改）
      PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
